[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biotransfer"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "rdkit",
    "tqdm",
    "requests",
    "torch",
    "torch-geometric",
    "numpy",
    "scikit-learn",
    "wandb",
    "transformers",
    "xgboost",
    "omegaconf",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
